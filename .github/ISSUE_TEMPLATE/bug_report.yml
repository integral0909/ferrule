name: Bug report
description: Something in Ferrule behaves incorrectly.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the pipeline config (redacted) and any Ferrule Script involved.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Ferrule version
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version and OS
