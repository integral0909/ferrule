version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-tooling:
        dependency-type: development
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint supports TypeScript <6.1; move to 7.x when it does.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Type definitions track the oldest supported Node.js major (engines: >=22.12).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
